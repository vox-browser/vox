name: Snap release

# Pre-built Linux x86-64 Snap. Tags named v* build, package and publish
# a GitHub Release; workflow_dispatch and pull requests touching this file
# run the same build and packaging without publishing.
#
# The tag must match packaging/version.txt (e.g. tag v0.1.3 for "0.1.3");
# the version gate fails the job otherwise.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release-snap.yml
      - packaging/snap/**
      - tools/check_snap_manifest.py
  workflow_dispatch:

# Single job on purpose: passing artifacts between jobs would need extra
# pinned actions. Publishing needs contents: write; everything else only
# reads.
permissions:
  contents: write

concurrency:
  group: release-snap-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      V_REVISION: 27c8699f26ef90d06449f866aeca145acf7e8289
      RUSTUP_TOOLCHAIN: stable
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the reviewed checkout
        run: |
          # The supervisor requires a regular checkout on master. Keep the
          # checked-out push/PR commit; never replace it with origin/master.
          git checkout -B master
          git rev-parse HEAD

      - name: Check the Snap scaffolding
        run: python3 tools/check_snap_manifest.py

      - name: Check tag matches packaging/version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "print(open('packaging/version.txt',encoding='utf-8-sig').read().strip())")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME != packaging/version.txt ($version)" >&2
            exit 1
          fi
          echo "releasing Vox $version"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build generate-ninja pkg-config \
            python3 git curl ca-certificates libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev libharfbuzz-dev libicu-dev libwoff-dev libbrotli-dev \
            libcurl4-openssl-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libx11-dev \
            libasound2-dev libgc-dev libfreetype-dev libfontconfig-dev \
            libwebp-dev libpng-dev libjpeg-dev fonts-liberation2 fonts-dejavu-core \
            squashfs-tools
          pkg-config --modversion javascriptcoregtk-4.1
          rustup toolchain install stable --profile minimal --no-self-update
          rustc --version

      - name: Add swap for the C compilation
        run: |
          sudo fallocate -l 8G "$RUNNER_TEMP/vox.swap"
          sudo chmod 600 "$RUNNER_TEMP/vox.swap"
          sudo mkswap "$RUNNER_TEMP/vox.swap"
          sudo swapon "$RUNNER_TEMP/vox.swap"

      - name: Build pinned V and fetch UI2
        timeout-minutes: 25
        run: |
          git init "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" remote add origin https://github.com/vlang/v.git
          git -C "$RUNNER_TEMP/v" fetch --depth 1 origin "$V_REVISION"
          git -C "$RUNNER_TEMP/v" checkout --detach FETCH_HEAD
          # No VFLAGS here: extra V flags break the v1-to-v2 bootstrap at
          # this pin (unresolved string helper at link time). The memory
          # guard on this step still bounds the build RSS; -memory-limit
          # stays on every V invocation that compiles or tests Vox itself.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-v-build.lock" \
            --report "$RUNNER_TEMP/vox-v-build.json" --timeout 1200 -- \
            make -C "$RUNNER_TEMP/v" -j2
          "$RUNNER_TEMP/v/v" version
          git init "$RUNNER_TEMP/ui2"
          git -C "$RUNNER_TEMP/ui2" remote add origin https://github.com/vlang/ui2.git
          git -C "$RUNNER_TEMP/ui2" fetch --depth 1 origin HEAD
          git -C "$RUNNER_TEMP/ui2" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/v" rev-parse HEAD > "$RUNNER_TEMP/vox-v-revision.txt"
          git -C "$RUNNER_TEMP/ui2" rev-parse HEAD > "$RUNNER_TEMP/vox-ui2-revision.txt"
          printf 'V_BIN=%s/v\nUI2_SOURCE_DIR=%s\n' \
            "$RUNNER_TEMP/v" "$RUNNER_TEMP/ui2" >> "$GITHUB_ENV"

      - name: Build Vox
        timeout-minutes: 90
        run: |
          # Native dependencies build inside build-linux-browser.sh via
          # tools/build_linux_native.py; there is no separate Skia step.
          # build-prod-browser.sh runs --headless-smoke before publishing
          # Build/linux/vox, so a green build already passed the smoke gate.
          sh build-prod-browser.sh
          test -x Build/linux/vox

      - name: Stage the Snap prime
        run: |
          set -euo pipefail
          rm -rf release-staging snap
          mkdir -p release-staging/snap-prime/bin snap/gui
          shopt -s nullglob
          cp Build/linux/vox release-staging/snap-prime/bin/
          shared_libs=(Build/linux/*.so)
          if [ ${#shared_libs[@]} -gt 0 ]; then
            cp "${shared_libs[@]}" release-staging/snap-prime/bin/
          fi
          cp packaging/snap/snapcraft.yaml snap/snapcraft.yaml
          cp packaging/snap/org.vox_browser.vox.desktop snap/gui/
          cp packaging/Vox.png snap/gui/org.vox_browser.vox.png
          test -f snap/snapcraft.yaml
          ls -la release-staging/snap-prime/bin snap/gui

      - name: Build the Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Smoke-test the Snap payload
        run: |
          set -euo pipefail
          snap_file="${{ steps.snapcraft.outputs.snap }}"
          test -f "$snap_file"
          rm -rf squashfs-root
          unsquashfs -d squashfs-root "$snap_file" bin
          ./squashfs-root/bin/vox --headless-smoke
          rm -rf squashfs-root
          ls -la "$snap_file"

      - name: Checksums
        run: |
          set -euo pipefail
          snap_file="${{ steps.snapcraft.outputs.snap }}"
          sha256sum "$snap_file" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c "print(open('packaging/version.txt',encoding='utf-8-sig').read().strip())")
          snap_file="${{ steps.snapcraft.outputs.snap }}"
          flags=""
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-beta*) flags="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "Vox $version (Linux snap)" \
            --generate-notes $flags \
            "$snap_file" SHA256SUMS
