name: Browser build and lifecycle

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser (${{ matrix.gc }})
    runs-on: ubuntu-24.04
    # Leave room for independent suites even when the production build uses
    # its full timeout. Individual steps retain their tighter bounds.
    timeout-minutes: 360
    strategy:
      # Keep evidence from both allocation models when one of them fails.
      fail-fast: false
      matrix:
        gc: [boehm, prealloc]
    env:
      # FastC must support JSON enum attributes and dynamic-array decoding.
      # XML allocation fixes: https://github.com/vlang/v/pull/32104
      V_REVISION: f7f3add7af3c4615ba5dbedc06e18f76ef604346
      JOBS: '2'
      LADYBIRD_V_GC: ${{ matrix.gc }}
      VOX_ARENA_POISON: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the reviewed checkout
        id: reviewed_checkout
        run: |
          # The supervisor requires a regular checkout on master. Keep the
          # checked-out push/PR commit; never replace it with origin/master.
          git checkout -B master
          git rev-parse HEAD

      - name: Check the Linux build entrypoint
        run: |
          python3 tools/build_linux_browser_test.py
          python3 tools/rebuild_browser_test.py
          python3 tools/prepare_http_compat_test.py
          python3 tools/prepare_ui2_test.py
          python3 tools/ci_stackoverflow_instructions_test.py
          python3 tools/prepare_linux_modules_test.py
          python3 tools/test_linux_browser_test.py

      - name: Install Linux dependencies
        id: system_dependencies
        if: ${{ !cancelled() && steps.reviewed_checkout.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build generate-ninja pkg-config \
            python3 git curl ca-certificates nodejs openssl libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev libharfbuzz-dev \
            libcurl4-openssl-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libx11-dev \
            libasound2-dev libgc-dev libfreetype-dev libfontconfig-dev \
            libwebp-dev libpng-dev libjpeg-dev fonts-liberation2 fonts-dejavu-core \
            xvfb xauth xdotool scrot
          pkg-config --modversion javascriptcoregtk-4.1

      - name: Check tab process exit diagnostics
        if: ${{ !cancelled() && steps.system_dependencies.outcome == 'success' && matrix.gc == 'boehm' }}
        timeout-minutes: 2
        run: |
          # A child crash during Ctrl+W must not look like successful retirement.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-tab-process.lock" \
            --report "$RUNNER_TEMP/vox-tab-process.json" --limit-gib 3 --timeout 60 -- \
            python3 tools/test_tab_process_lifecycle.py

      - name: Add swap for the C compilation
        if: ${{ !cancelled() && steps.system_dependencies.outcome == 'success' }}
        run: |
          # Standard private-repository runners have less RAM than the large
          # single-file C build needs. The 12 GiB process-tree guard stays on.
          sudo fallocate -l 8G "$RUNNER_TEMP/vox.swap"
          sudo chmod 600 "$RUNNER_TEMP/vox.swap"
          sudo mkswap "$RUNNER_TEMP/vox.swap"
          sudo swapon "$RUNNER_TEMP/vox.swap"

      - name: Build pinned V and fetch UI2
        id: toolchain
        if: ${{ !cancelled() && steps.system_dependencies.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          git init "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" remote add origin https://github.com/vlang/v.git
          git -C "$RUNNER_TEMP/v" fetch --depth 1 origin "$V_REVISION"
          git -C "$RUNNER_TEMP/v" checkout --detach FETCH_HEAD
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-v-build.lock" \
            --report "$RUNNER_TEMP/vox-v-build.json" --timeout 1200 -- \
            make -C "$RUNNER_TEMP/v" -j2 VFLAGS='-memory-limit 10G'
          "$RUNNER_TEMP/v/v" version
          git init "$RUNNER_TEMP/ui2"
          git -C "$RUNNER_TEMP/ui2" remote add origin https://github.com/vlang/ui2.git
          git -C "$RUNNER_TEMP/ui2" fetch --depth 1 origin HEAD
          git -C "$RUNNER_TEMP/ui2" checkout --detach FETCH_HEAD
          # UI2 intentionally follows upstream HEAD; preserve the exact inputs
          # alongside the results so this run can be reproduced.
          git -C "$RUNNER_TEMP/v" rev-parse HEAD > "$RUNNER_TEMP/vox-v-revision.txt"
          git -C "$RUNNER_TEMP/ui2" rev-parse HEAD > "$RUNNER_TEMP/vox-ui2-revision.txt"
          printf 'V_BIN=%s/v\nUI2_SOURCE_DIR=%s\n' \
            "$RUNNER_TEMP/v" "$RUNNER_TEMP/ui2" >> "$GITHUB_ENV"

      - name: Check native GLES without ANGLE
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && matrix.gc == 'boehm' }}
        timeout-minutes: 15
        run: python3 tools/test_webgl_gles.py --output Build/linux/webgl-gles

      - name: Check vlib XML input compatibility
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && matrix.gc == 'boehm' }}
        timeout-minutes: 10
        run: |
          # The production XML input adapter depends only on vlib, so its
          # parsing contracts run before the browser's native dependencies.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-xml-compat.lock" \
            --report "$RUNNER_TEMP/vox-xml-compat.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -b c -memory-limit 10G test xmlcompat
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-xml-compat-nogc.lock" \
            --report "$RUNNER_TEMP/vox-xml-compat-nogc.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -b c -memory-limit 10G -gc none test xmlcompat

      - name: Check resource cache and cancellation contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && matrix.gc == 'boehm' }}
        timeout-minutes: 10
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-cache.lock" \
            --report "$RUNNER_TEMP/vox-resource-cache.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -memory-limit 10G test cachepolicy
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-cache-nogc.lock" \
            --report "$RUNNER_TEMP/vox-resource-cache-nogc.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -memory-limit 10G -gc none test cachepolicy
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-lifecycle.lock" \
            --report "$RUNNER_TEMP/vox-resource-lifecycle.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_lifecycle.py
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-v.lock" \
            --report "$RUNNER_TEMP/vox-resource-v.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_v_contracts.py --v "$V_BIN"
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-v-prealloc.lock" \
            --report "$RUNNER_TEMP/vox-resource-v-prealloc.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_v_contracts.py --v "$V_BIN" --prealloc

      - name: Check production FastC tab metadata
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          # This fast gate compiles the actual metadata codec with FastC in
          # both allocation modes, before the full browser's native build.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-tab-codec-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-tab-codec-$LADYBIRD_V_GC.json" --timeout 540 -- \
            python3 tools/test_tab_metadata_codec.py --v "$V_BIN" --gc "$LADYBIRD_V_GC"

      - name: Build native dependencies
        id: native_dependencies
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/Build/deps/lib/pkgconfig"
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-native-build.lock" \
            --report "$RUNNER_TEMP/vox-native-build.json" --timeout 300 -- \
            python3 tools/build_linux_native.py

      - name: Check WebGL GLES service and shader equivalence
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-webgl-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-webgl-$LADYBIRD_V_GC.json" --timeout 1080 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              webgl/native_draw_test.v webgl/native_essl_equivalence_test.v \
              webgl/native_parameter_query_test.v imageraster/canvas_upload_test.v

      - name: Check portable shadow and canvas rasterization
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-raster-test.lock" \
            --report "$RUNNER_TEMP/vox-raster-test.json" --timeout 300 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" cpuraster/shadow_command_test.v

      - name: Check structured storage integer codecs
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          # Preserve storage wire bytes, integer-width errors and IPC behavior
          # through the actual HTML, FileAPI and CryptoKey owners in both modes.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-structured-codec-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-structured-codec-$LADYBIRD_V_GC.json" --timeout 1440 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              html/structured_leb128_test.v \
              html/structured_serialize_storage_codec_test.v \
              html/structured_fileapi_codec_test.v \
              html/structured_crypto_key_codec_test.v

      - name: Compare XML parser CPU and retained memory
        id: xml_performance
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' && matrix.gc == 'prealloc' }}
        timeout-minutes: 45
        env:
          # Used only for exact-SHA fetches; checkout retains no credentials.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Three optimized C builds share this checkout's DOM engine and
          # native libraries. The driver fetches exact historical parser blobs
          # when absent from the shallow checkout, then restores source files.
          # Allocator poisoning remains enabled for all correctness steps;
          # only the measured subprocesses disable poison and no-reuse modes.
          # Unrelated complete event diffs produce a skipped comparison receipt;
          # missing history or manual dispatch always runs the full benchmark.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-xml-performance.lock" \
            --report "$RUNNER_TEMP/vox-xml-performance.json" --timeout 2640 -- \
            python3 tools/benchmark_xml_parser.py --gc prealloc --pairs 7 --changed-only \
              --output "Build/linux/tests/prealloc/run-xml-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Preserve XML performance evidence immediately
        if: ${{ always() && !cancelled() && matrix.gc == 'prealloc' && (steps.xml_performance.outcome == 'success' || steps.xml_performance.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xml-performance-receipts
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vox-xml-performance.json
            Build/linux/tests/prealloc/run-xml-performance-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            Build/linux/tests/prealloc/run-xml-performance-${{ github.run_id }}-${{ github.run_attempt }}/*.log

      - name: Build Vox and run the headless smoke test
        id: production_build
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 50
        run: |
          # The normal supervisor applies the build memory guard and runs
          # --headless-smoke before publishing Build/linux/vox.
          sh build-prod-browser.sh
          test -x Build/linux/vox

      - name: Check the native window and tab lifecycle
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          # This is the full supervised binary, including the staged prealloc
          # runtime in that matrix entry. Xvfb exercises window/UI startup,
          # input, native redraw, process tabs and graceful teardown.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-window-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-window-$LADYBIRD_V_GC.json" \
            --limit-gib 3 --timeout 600 -- \
            python3 tools/test_linux_browser.py Build/linux/vox

      # Focused C-backend suites depend on prepared native libraries, not on
      # the FastC browser build or on preceding test results. Keep collecting
      # failures without making the failed production/window gate optional.
      - name: Check CSS cascade heads and scratch ownership
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          # Exercise the dense index with the actual cascade, independent
          # precedence oracle, retained values and computed-longhand cache.
          # The matrix covers collector and poisoned production arena storage.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-cascade-heads-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-cascade-heads-$LADYBIRD_V_GC.json" --timeout 1740 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              css/cascade_heads_test.v \
              css/cascade_entry_array_test.v \
              css/cascaded_property_entry_storage_test.v \
              css/cascade_local_scratch_test.v \
              css/cascade_scratch_test.v \
              css/computed_longhand_reuse_test.v

      - name: Check XML DOM and document integration
        id: xml_integration
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          # Exercise the same vlib parser through DOMParser, fragments,
          # document loading and XHR in both supported allocation models.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-xml-integration-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-xml-integration-$LADYBIRD_V_GC.json" --timeout 2640 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              html/vlib_xml_test.v \
              html/dom_parser_test.v \
              html/xml_document_test.v \
              html/xml_fragment_test.v \
              html/xml_namespace_test.v \
              xhr/document_response_test.v \
              html/document_loading_bridge_test.v

      - name: Preserve XML integration evidence immediately
        if: ${{ always() && !cancelled() && (steps.xml_integration.outcome == 'success' || steps.xml_integration.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xml-integration-receipts-${{ matrix.gc }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/vox-xml-integration-${{ matrix.gc }}.json
            Build/linux/tests/${{ matrix.gc }}/run-*/vlib_xml_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/dom_parser_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/xml_document_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/xml_fragment_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/xml_namespace_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/document_response_test.*
            Build/linux/tests/${{ matrix.gc }}/run-*/document_loading_bridge_test.*

      - name: Check retained storage with the production allocator
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' && matrix.gc == 'prealloc' }}
        timeout-minutes: 15
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/Build/deps/lib/pkgconfig"
          # Poison released arenas so stale borrowed payloads fault rather
          # than surviving accidentally in a reusable allocation block.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-ownership-tests.lock" \
            --report "$RUNNER_TEMP/vox-ownership-tests.json" --timeout 840 -- \
            python3 tools/test_linux_native.py --gc prealloc \
              platform/closure_metadata_arena_test.v \
              platform/retained_arena_test.v \
              platform/retained_arena_lifetime_test.v \
              dom/native_adoption_storage_test.v \
              html/native_document_storage_test.v \
              layout/hosted_scene_storage_test.v \
              layout/native_layout_retirement_test.v \
              layout/navigable_fallback_storage_test.v \
              layout/svg_document_storage_test.v \
              layout/static_svg_scene_test.v

      - name: Check display-list recording ownership
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          # Replay identity and buffer recycling must agree in collector and
          # production arena builds. Each executable has a 3 GiB runtime guard.
          # Poison released arenas to expose any stale recording readers.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-recording-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-recording-$LADYBIRD_V_GC.json" --timeout 840 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              layout/display_list_recording_test.v \
              layout/visual_context_memo_test.v

      - name: Check native DOM authority and projections
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-dom-authority-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-dom-authority-$LADYBIRD_V_GC.json" --timeout 1200 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              compact/native_attributes_test.v \
              compact/mutation_boundary_test.v \
              compact/pending_iteration_test.v \
              dom/native_attribute_identity_test.v \
              layout/lazy_dom_visual_lines_test.v

      - name: Check document session lifecycles
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          # The same owner must survive suspension and retire exactly once in
          # collector and production arena builds, including external frames.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-session-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-session-$LADYBIRD_V_GC.json" --timeout 2340 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              capture/portable_screenshot_test.v \
              browserapp/application_test.v \
              browserapp/browser_tabs_test.v \
              document/session_test.v \
              document/child_storage_test.v \
              navigation/controller_test.v \
              navigation/back_forward_cache_test.v \
              navigation/blob_url_cache_lifetime_test.v \
              navigation/retire_before_styles_test.v \
              browserapp/browser_zoom_test.v

      - name: Check resource consumers and navigation retirement
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          # Exercise the adapters and document owners against the full engine,
          # in addition to the fast cache and native transport contracts above.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-integration.lock" \
            --report "$RUNNER_TEMP/vox-resource-integration.json" --timeout 1980 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              resources/cache_reuse_test.v \
              navigation/preload_cancellation_test.v \
              fetch/upstream_entry_points_test.v

      - name: Check parser script lifecycles
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' }}
        timeout-minutes: 60
        run: |
          # Compile each focused case under the build budget. The runner gives
          # each executable its own 3 GiB runtime guard and preserves its log.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-parser-tests.lock" \
            --report "$RUNNER_TEMP/vox-parser-tests.json" --timeout 3000 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              html/parser_script_lifecycle_test.v \
              script/parser_lifecycle_test.v \
              document/child_parser_lifecycle_test.v \
              resources/parser_script_requests_test.v \
              resources/tokenized_preloads_test.v \
              resources/external_scripts_test.v \
              compact/document_write_test.v \
              compact/named_elements_test.v

      - name: Check parser resumption storage with the production allocator
        if: ${{ !cancelled() && steps.native_dependencies.outcome == 'success' && matrix.gc == 'prealloc' }}
        timeout-minutes: 10
        run: |
          # Parser resumption can run inside a temporary frame arena. Exercise
          # its retained document storage with the production allocator too.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-parser-storage-tests.lock" \
            --report "$RUNNER_TEMP/vox-parser-storage-tests.json" --timeout 480 -- \
            python3 tools/test_linux_native.py --gc prealloc \
              html/native_scripted_tokenizer_storage_test.v

      - name: Show build and smoke receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          paths = sorted(temporary.glob('vox-*.json'))
          paths.extend(sorted(temporary.glob('vox-*-revision.txt')))
          paths.extend(Path('Build/linux/browser-smoke').glob('*.log'))
          paths.extend(Path('Build/linux/webgl-gles').glob('*.log'))
          paths.extend(Path('Build/linux/webgl-gles').glob('*.json'))
          paths.extend(Path('Build/linux/tests').glob('*/run-*/*.log'))
          paths.extend(Path('Build/linux/tests').glob('*/run-*/*.json'))
          receipts = sorted(Path('Build/linux/production-build/receipts').glob('*'))
          for receipt in receipts[-1:]:
              paths.extend(receipt / name for name in (
                  'build.log', 'smoke.log', 'memory.json', 'smoke-memory.json', 'result.json'))
          for path in paths:
              if path.is_file():
                  print(f'::group::{path}')
                  print(path.read_text(errors='replace')[-30000:])
                  print('::endgroup::')
          PY

      - name: Preserve build and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.gc }}-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vox-*.json
            ${{ runner.temp }}/vox-*-revision.txt
            Build/linux/production-build/receipts/*/*.log
            Build/linux/production-build/receipts/*/*.json
            Build/linux/tests/*/run-*/*.log
            Build/linux/tests/*/run-*/*.json
            Build/linux/browser-smoke/
            Build/linux/webgl-gles/*.log
            Build/linux/webgl-gles/*.json

  # These suites compile the production Cocoa/IOSurface headers directly and
  # need neither V nor a prebuilt app. Full macOS app/tab and Metal pixel
  # acceptance remain separate; the standard runner is not a GPU guarantee.
  macos_native:
    name: macOS native lifecycle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Cocoa window replacement and redraw
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Build/macos-tests
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-window.lock" \
            --report "$RUNNER_TEMP/vox-window.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_native_browser_window.py 2>&1 | tee Build/macos-tests/window.log

      - name: Check native frame publication and retirement
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-publication.lock" \
            --report "$RUNNER_TEMP/vox-publication.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_native_frame_publication.py --output Build/macos-tests/publication

      - name: Check retained IOSurface frame pools
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-frame-pool.lock" \
            --report "$RUNNER_TEMP/vox-frame-pool.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_native_layer_frame_pool.py --output Build/macos-tests/frame-pool

      - name: Check prepared-frame wake ownership
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-prepared-wakes.lock" \
            --report "$RUNNER_TEMP/vox-prepared-wakes.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_native_prepared_wakes.py --output Build/macos-tests/prepared-wakes

      - name: Preserve macOS native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-lifecycle-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vox-*.json
            Build/macos-tests/**/*.log
            Build/macos-tests/**/*.json

  # Preserve the existing required-check name and require every platform gate.
  build:
    needs: [browser, macos_native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both allocation models and macOS native lifecycle
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          MACOS_NATIVE_RESULT: ${{ needs.macos_native.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$MACOS_NATIVE_RESULT" = success
