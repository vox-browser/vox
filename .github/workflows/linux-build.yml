name: Linux build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser (${{ matrix.gc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # Keep evidence from both allocation models when one of them fails.
      fail-fast: false
      matrix:
        gc: [boehm, prealloc]
    env:
      # FastC must support JSON enum attributes and dynamic-array decoding.
      V_REVISION: 339affce1891514d11aeb7111f579845d966a138
      RUSTUP_TOOLCHAIN: stable
      JOBS: '2'
      LADYBIRD_V_GC: ${{ matrix.gc }}
      VOX_ARENA_POISON: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the reviewed checkout
        run: |
          # The supervisor requires a regular checkout on master. Keep the
          # checked-out push/PR commit; never replace it with origin/master.
          git checkout -B master
          git rev-parse HEAD

      - name: Check the Linux build entrypoint
        run: |
          python3 tools/build_linux_browser_test.py
          python3 tools/rebuild_browser_test.py
          python3 tools/prepare_ui2_test.py
          python3 tools/ci_stackoverflow_instructions_test.py
          python3 tools/prepare_linux_modules_test.py
          python3 tools/test_linux_browser_test.py

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build generate-ninja pkg-config \
            python3 git curl ca-certificates nodejs openssl libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev libharfbuzz-dev libicu-dev libwoff-dev libbrotli-dev \
            libcurl4-openssl-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libx11-dev \
            libasound2-dev libgc-dev libfreetype-dev libfontconfig-dev \
            libwebp-dev libpng-dev libjpeg-dev fonts-liberation2 fonts-dejavu-core \
            xvfb xauth xdotool scrot
          pkg-config --modversion javascriptcoregtk-4.1
          rustup toolchain install stable --profile minimal --no-self-update
          rustc --version

      - name: Check tab process exit diagnostics
        if: matrix.gc == 'boehm'
        timeout-minutes: 2
        run: |
          # A child crash during Ctrl+W must not look like successful retirement.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-tab-process.lock" \
            --report "$RUNNER_TEMP/vox-tab-process.json" --limit-gib 3 --timeout 60 -- \
            python3 tools/test_tab_process_lifecycle.py

      - name: Add swap for the C compilation
        run: |
          # Standard private-repository runners have less RAM than the large
          # single-file C build needs. The 12 GiB process-tree guard stays on.
          sudo fallocate -l 8G "$RUNNER_TEMP/vox.swap"
          sudo chmod 600 "$RUNNER_TEMP/vox.swap"
          sudo mkswap "$RUNNER_TEMP/vox.swap"
          sudo swapon "$RUNNER_TEMP/vox.swap"

      - name: Build pinned V and fetch UI2
        timeout-minutes: 25
        run: |
          git init "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" remote add origin https://github.com/vlang/v.git
          git -C "$RUNNER_TEMP/v" fetch --depth 1 origin "$V_REVISION"
          git -C "$RUNNER_TEMP/v" checkout --detach FETCH_HEAD
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-v-build.lock" \
            --report "$RUNNER_TEMP/vox-v-build.json" --timeout 1200 -- \
            make -C "$RUNNER_TEMP/v" -j2 VFLAGS='-memory-limit 10G'
          "$RUNNER_TEMP/v/v" version
          git init "$RUNNER_TEMP/ui2"
          git -C "$RUNNER_TEMP/ui2" remote add origin https://github.com/vlang/ui2.git
          git -C "$RUNNER_TEMP/ui2" fetch --depth 1 origin HEAD
          git -C "$RUNNER_TEMP/ui2" checkout --detach FETCH_HEAD
          printf 'V_BIN=%s/v\nUI2_SOURCE_DIR=%s\n' \
            "$RUNNER_TEMP/v" "$RUNNER_TEMP/ui2" >> "$GITHUB_ENV"

      - name: Check resource cache and cancellation contracts
        if: matrix.gc == 'boehm'
        timeout-minutes: 10
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-cache.lock" \
            --report "$RUNNER_TEMP/vox-resource-cache.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -memory-limit 10G test cachepolicy
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-cache-nogc.lock" \
            --report "$RUNNER_TEMP/vox-resource-cache-nogc.json" --limit-gib 3 --timeout 300 -- \
            "$V_BIN" -memory-limit 10G -gc none test cachepolicy
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-lifecycle.lock" \
            --report "$RUNNER_TEMP/vox-resource-lifecycle.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_lifecycle.py
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-v.lock" \
            --report "$RUNNER_TEMP/vox-resource-v.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_v_contracts.py --v "$V_BIN"
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-v-prealloc.lock" \
            --report "$RUNNER_TEMP/vox-resource-v-prealloc.json" --limit-gib 3 --timeout 300 -- \
            python3 tools/test_resource_v_contracts.py --v "$V_BIN" --prealloc

      - name: Cache pinned Skia
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Build/deps
          key: linux-skia-ubuntu24-${{ runner.arch }}-${{ hashFiles('tools/build_linux_skia.py') }}

      - name: Build Skia
        timeout-minutes: 45
        run: |
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-skia-build.lock" \
            --report "$RUNNER_TEMP/vox-skia-build.json" --timeout 2400 -- \
            python3 tools/build_linux_skia.py

      - name: Check native Skia linking and rendering
        timeout-minutes: 10
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/Build/deps/lib/pkgconfig"
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-native-build.lock" \
            --report "$RUNNER_TEMP/vox-native-build.json" --timeout 300 -- \
            python3 tools/build_linux_native.py
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-skia-test.lock" \
            --report "$RUNNER_TEMP/vox-skia-test.json" --timeout 300 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" skia/shadow_test.v

      - name: Build Vox and run the headless smoke test
        timeout-minutes: 50
        run: |
          # The normal supervisor applies the build memory guard and runs
          # --headless-smoke before publishing Build/linux/vox.
          sh build-prod-browser.sh
          test -x Build/linux/vox

      - name: Check the native window and tab lifecycle
        timeout-minutes: 12
        run: |
          # This is the full supervised binary, including the staged prealloc
          # runtime in that matrix entry. Xvfb exercises window/UI startup,
          # input, native redraw, process tabs and graceful teardown.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-window-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-window-$LADYBIRD_V_GC.json" \
            --limit-gib 3 --timeout 600 -- \
            python3 tools/test_linux_browser.py Build/linux/vox

      - name: Check retained storage with the production allocator
        if: matrix.gc == 'prealloc'
        timeout-minutes: 15
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/Build/deps/lib/pkgconfig"
          # Poison released arenas so stale borrowed payloads fault rather
          # than surviving accidentally in a reusable allocation block.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-ownership-tests.lock" \
            --report "$RUNNER_TEMP/vox-ownership-tests.json" --timeout 840 -- \
            python3 tools/test_linux_native.py --gc prealloc \
              platform/closure_metadata_arena_test.v \
              platform/retained_arena_test.v \
              platform/retained_arena_lifetime_test.v \
              dom/native_adoption_storage_test.v \
              html/native_document_storage_test.v \
              layout/hosted_scene_storage_test.v \
              layout/native_layout_retirement_test.v \
              layout/navigable_fallback_storage_test.v \
              layout/svg_document_storage_test.v \
              layout/static_svg_scene_test.v

      - name: Check display-list recording ownership
        timeout-minutes: 15
        run: |
          # Replay identity and buffer recycling must agree in collector and
          # production arena builds. Each executable has a 3 GiB runtime guard.
          # Poison released arenas to expose any stale recording readers.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-recording-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-recording-$LADYBIRD_V_GC.json" --timeout 840 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              layout/display_list_recording_test.v \
              layout/visual_context_memo_test.v

      - name: Check native DOM authority and projections
        timeout-minutes: 25
        run: |
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-dom-authority-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-dom-authority-$LADYBIRD_V_GC.json" --timeout 1200 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              compact/native_attributes_test.v \
              compact/mutation_boundary_test.v \
              dom/native_attribute_identity_test.v \
              layout/lazy_dom_visual_lines_test.v

      - name: Check document session lifecycles
        timeout-minutes: 40
        run: |
          # The same owner must survive suspension and retire exactly once in
          # collector and production arena builds, including external frames.
          export VOX_ARENA_POISON=1
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-session-$LADYBIRD_V_GC.lock" \
            --report "$RUNNER_TEMP/vox-session-$LADYBIRD_V_GC.json" --timeout 2340 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              document/session_test.v \
              document/child_storage_test.v \
              navigation/controller_test.v \
              navigation/back_forward_cache_test.v \
              navigation/blob_url_cache_lifetime_test.v \
              navigation/retire_before_styles_test.v \
              browserapp/browser_tabs_test.v \
              browserapp/browser_zoom_test.v

      - name: Check resource consumers and navigation retirement
        timeout-minutes: 35
        run: |
          # Exercise the adapters and document owners against the full engine,
          # in addition to the fast cache and native transport contracts above.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-resource-integration.lock" \
            --report "$RUNNER_TEMP/vox-resource-integration.json" --timeout 1980 -- \
            python3 tools/test_linux_native.py --gc "$LADYBIRD_V_GC" \
              resources/cache_reuse_test.v \
              navigation/preload_cancellation_test.v \
              fetch/upstream_entry_points_test.v

      - name: Check parser script lifecycles
        if: matrix.gc == 'boehm'
        timeout-minutes: 60
        run: |
          # Compile each focused case under the build budget. The runner gives
          # each executable its own 3 GiB runtime guard and preserves its log.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-parser-tests.lock" \
            --report "$RUNNER_TEMP/vox-parser-tests.json" --timeout 3000 -- \
            python3 tools/test_linux_native.py \
              html/parser_script_lifecycle_test.v \
              script/parser_lifecycle_test.v \
              document/child_parser_lifecycle_test.v \
              resources/parser_script_requests_test.v \
              resources/tokenized_preloads_test.v \
              resources/external_scripts_test.v \
              compact/document_write_test.v \
              compact/named_elements_test.v

      - name: Check parser resumption storage with the production allocator
        if: matrix.gc == 'prealloc'
        timeout-minutes: 10
        run: |
          # Parser resumption can run inside a temporary frame arena. Exercise
          # its retained document storage with the production allocator too.
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-parser-storage-tests.lock" \
            --report "$RUNNER_TEMP/vox-parser-storage-tests.json" --timeout 480 -- \
            python3 tools/test_linux_native.py --gc prealloc \
              html/native_scripted_tokenizer_storage_test.v

      - name: Show build and smoke receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          paths = sorted(temporary.glob('vox-*.json'))
          paths.extend(Path('Build/linux/browser-smoke').glob('*.log'))
          paths.extend(Path('Build/linux/tests').glob('*/run-*/*.log'))
          paths.extend(Path('Build/linux/tests').glob('*/run-*/*.json'))
          receipts = sorted(Path('Build/linux/production-build/receipts').glob('*'))
          for receipt in receipts[-1:]:
              paths.extend(receipt / name for name in (
                  'build.log', 'smoke.log', 'memory.json', 'smoke-memory.json', 'result.json'))
          for path in paths:
              if path.is_file():
                  print(f'::group::{path}')
                  print(path.read_text(errors='replace')[-30000:])
                  print('::endgroup::')
          PY

      - name: Preserve build and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.gc }}-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/vox-*.json
            Build/linux/production-build/receipts/*/*.log
            Build/linux/production-build/receipts/*/*.json
            Build/linux/tests/*/run-*/*.log
            Build/linux/tests/*/run-*/*.json
            Build/linux/browser-smoke/

  # Preserve the existing required-check name and require both matrix entries.
  build:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both allocation models
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
