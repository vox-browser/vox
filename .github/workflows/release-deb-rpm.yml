name: DEB/RPM release

# Pre-built Linux x86-64 system packages. Tags named v* build, package and
# publish a GitHub Release; workflow_dispatch and pull requests touching
# this file run the same build and packaging without publishing.
#
# The tag must match packaging/version.txt (e.g. tag v0.1.3 for "0.1.3");
# the version gate fails the job otherwise.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release-deb-rpm.yml
      - packaging/deb-rpm/**
      - tools/check_deb_rpm_manifest.py
  workflow_dispatch:

# Single job on purpose: passing artifacts between jobs would need extra
# pinned actions. Publishing needs contents: write; everything else only
# reads.
permissions:
  contents: write

concurrency:
  group: release-deb-rpm-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: stable
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the reviewed checkout
        run: |
          # The supervisor requires a regular checkout on master. Keep the
          # checked-out push/PR commit; never replace it with origin/master.
          git checkout -B master
          git rev-parse HEAD

      - name: Check the DEB/RPM scaffolding
        run: python3 tools/check_deb_rpm_manifest.py

      - name: Check tag matches packaging/version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "print(open('packaging/version.txt',encoding='utf-8-sig').read().strip())")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME != packaging/version.txt ($version)" >&2
            exit 1
          fi
          echo "releasing Vox $version"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build generate-ninja pkg-config \
            python3 git curl ca-certificates libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev libharfbuzz-dev libicu-dev libwoff-dev libbrotli-dev \
            libcurl4-openssl-dev libssl-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgl1-mesa-dev libxi-dev libxcursor-dev libxrandr-dev libx11-dev \
            libasound2-dev libgc-dev libfreetype-dev libfontconfig-dev \
            libwebp-dev libpng-dev libjpeg-dev fonts-liberation2 fonts-dejavu-core \
            rpm cpio
          pkg-config --modversion javascriptcoregtk-4.1
          rustup toolchain install stable --profile minimal --no-self-update
          rustc --version
          go version

      - name: Install nFPM
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Add swap for the C compilation
        run: |
          sudo fallocate -l 8G "$RUNNER_TEMP/vox.swap"
          sudo chmod 600 "$RUNNER_TEMP/vox.swap"
          sudo mkswap "$RUNNER_TEMP/vox.swap"
          sudo swapon "$RUNNER_TEMP/vox.swap"

      - name: Build V and fetch UI2
        # Unpinned shallow clone plus plain make, exactly like the master
        # scaffolding job: pinned source builds no longer bootstrap on
        # current runners (missing fd_poll.h, then an unresolved string
        # helper in the v1-to-v2 step at the old pin).
        timeout-minutes: 25
        run: |
          git clone --depth 1 https://github.com/vlang/v.git "$RUNNER_TEMP/v"
          python3 tools/run_memory_bounded.py \
            --lock "$RUNNER_TEMP/vox-v-build.lock" \
            --report "$RUNNER_TEMP/vox-v-build.json" --timeout 1200 -- \
            make -C "$RUNNER_TEMP/v" -j2
          "$RUNNER_TEMP/v/v" version
          git init "$RUNNER_TEMP/ui2"
          git -C "$RUNNER_TEMP/ui2" remote add origin https://github.com/vlang/ui2.git
          git -C "$RUNNER_TEMP/ui2" fetch --depth 1 origin HEAD
          git -C "$RUNNER_TEMP/ui2" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/v" rev-parse HEAD > "$RUNNER_TEMP/vox-v-revision.txt"
          git -C "$RUNNER_TEMP/ui2" rev-parse HEAD > "$RUNNER_TEMP/vox-ui2-revision.txt"
          printf 'V_BIN=%s/v\nUI2_SOURCE_DIR=%s\n' \
            "$RUNNER_TEMP/v" "$RUNNER_TEMP/ui2" >> "$GITHUB_ENV"

      - name: Build Vox
        timeout-minutes: 90
        run: |
          # Native dependencies build inside build-linux-browser.sh via
          # tools/build_linux_native.py; there is no separate Skia step.
          # build-prod-browser.sh runs --headless-smoke before publishing
          # Build/linux/vox, so a green build already passed the smoke gate.
          sh build-prod-browser.sh
          test -x Build/linux/vox

      - name: Stage the package prime
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir -p release-staging/deb-rpm-prime/usr/lib/vox \
            release-staging/deb-rpm-prime/usr/bin \
            release-staging/deb-rpm-prime/usr/share/applications \
            release-staging/deb-rpm-prime/usr/share/icons/hicolor/256x256/apps
          shopt -s nullglob
          cp Build/linux/vox release-staging/deb-rpm-prime/usr/lib/vox/
          shared_libs=(Build/linux/*.so)
          if [ ${#shared_libs[@]} -gt 0 ]; then
            cp "${shared_libs[@]}" release-staging/deb-rpm-prime/usr/lib/vox/
          fi
          cp packaging/deb-rpm/vox-wrapper.sh release-staging/deb-rpm-prime/usr/bin/vox
          chmod 755 release-staging/deb-rpm-prime/usr/bin/vox \
            release-staging/deb-rpm-prime/usr/lib/vox/vox
          cp packaging/deb-rpm/org.vox_browser.vox.desktop \
            release-staging/deb-rpm-prime/usr/share/applications/
          cp packaging/Vox.png \
            release-staging/deb-rpm-prime/usr/share/icons/hicolor/256x256/apps/org.vox_browser.vox.png
          find release-staging/deb-rpm-prime -printf '%M %p\n'

      - name: Build the DEB and RPM
        run: |
          set -euo pipefail
          export VOX_VERSION="$(python3 -c "print(open('packaging/version.txt',encoding='utf-8-sig').read().strip())")"
          test -n "$VOX_VERSION"
          nfpm package --config packaging/deb-rpm/nfpm.yaml --packager deb --target .
          nfpm package --config packaging/deb-rpm/nfpm.yaml --packager rpm --target .
          ls -la vox_*.deb vox-*.rpm

      - name: Smoke-test the package payloads
        run: |
          set -euo pipefail
          rm -rf deb-root
          dpkg-deb --contents vox_*.deb
          dpkg-deb -x vox_*.deb deb-root
          test -x deb-root/usr/bin/vox
          ./deb-root/usr/bin/vox --headless-smoke
          rm -rf deb-root
          rm -rf rpm-root
          mkdir rpm-root
          (cd rpm-root && rpm2cpio ../vox-*.rpm | cpio -idm)
          test -x rpm-root/usr/bin/vox
          ./rpm-root/usr/bin/vox --headless-smoke
          rm -rf rpm-root

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum vox_*.deb vox-*.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c "print(open('packaging/version.txt',encoding='utf-8-sig').read().strip())")
          flags=""
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-beta*) flags="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "Vox $version (Linux deb/rpm)" \
            --generate-notes $flags \
            vox_*.deb vox-*.rpm SHA256SUMS
