name: Arch Linux x86_64 release package

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit or tag containing Arch deployment support
        required: true
        default: master
      reuse_build_run:
        description: Optional successful production build artifact run ID to repackage and revalidate
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: arch-release-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref }}
          path: source
          persist-credentials: false

      - name: Retrieve an earlier compiled release artifact
        if: ${{ inputs.reuse_build_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_BUILD_RUN: ${{ inputs.reuse_build_run }}
        run: |
          case "$REUSE_BUILD_RUN" in *[!0-9]*|'') exit 1 ;; esac
          gh run download "$REUSE_BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "vox-arch-x86_64-$REUSE_BUILD_RUN" --dir source/Build

      - name: Add swap within the existing process memory budget
        if: ${{ inputs.reuse_build_run == '' }}
        run: |
          sudo fallocate -l 8G "$RUNNER_TEMP/vox-arch.swap"
          sudo chmod 600 "$RUNNER_TEMP/vox-arch.swap"
          sudo mkswap "$RUNNER_TEMP/vox-arch.swap"
          sudo swapon "$RUNNER_TEMP/vox-arch.swap"

      - name: Build and validate in native Arch Linux
        env:
          REUSE_BUILD_RUN: ${{ inputs.reuse_build_run }}
        run: |
          release_commit=$(git -C source rev-parse HEAD)
          docker run --rm --memory=12g --memory-swap=20g \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env RELEASE_COMMIT="$release_commit" \
            --env REUSE_BUILD_RUN archlinux:base-devel sh -eu -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                clang lld pkgconf git python procps-ng sudo libarchive zstd \
                webkit2gtk-4.1 glib2 harfbuzz curl openssl libglvnd mesa \
                libxi libxcursor libxrandr libx11 alsa-lib gc freetype2 \
                fontconfig libwebp libpng libjpeg-turbo ttf-dejavu \
                xorg-server-xvfb xorg-xauth xdotool scrot ca-certificates \
                gst-plugins-base-libs gst-plugins-good gst-libav glib-networking
              useradd --create-home builder
              printf "%s\n" "builder ALL=(ALL) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/vox-builder
              chown -R builder:builder /workspace/source
              mkdir /opt/vox-arch-toolchain
              chown builder:builder /opt/vox-arch-toolchain
              printf "%s\n" "#!/bin/sh" "exec clang -fuse-ld=lld \"\$@\"" > /usr/local/bin/vox-release-cc
              chmod +x /usr/local/bin/vox-release-cc
              extra=
              if [ -n "$REUSE_BUILD_RUN" ]; then extra=--package-only; fi
              sudo -u builder env CC=/usr/local/bin/vox-release-cc \
                python -u /workspace/tooling/tools/build_linux_release_ci.py \
                  --source /workspace/source --toolchain /opt/vox-arch-toolchain \
                  --expected-commit "$RELEASE_COMMIT" --distribution arch $extra
            '

      - name: Prepare container-owned validation evidence
        if: ${{ always() }}
        run: |
          if [ -d source/Build ]; then
            sudo chown -R "$(id -u):$(id -g)" source/Build
            find source/Build -type f -name '*.lock' -delete
          fi

      - name: Show failed production build logs
        if: ${{ failure() }}
        run: find source/Build/linux/production-build/receipts -name build.log -print -exec tail -n 180 {} \;

      - name: Preserve package and validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vox-arch-x86_64-${{ github.run_id }}
          path: |
            source/Build/deploy/
            source/Build/linux/production-build/
            source/Build/linux/vox
            source/Build/linux/libVoxAVIF.so
          if-no-files-found: error
          retention-days: 14
