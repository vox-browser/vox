<!doctype html>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #090b0f; }
main { position: absolute; left: 32px; top: 96px; width: 960px; height: 500px;
  overflow: hidden;
  background: radial-gradient(ellipse at 60% 110%, #43699557, transparent 65%),
    linear-gradient(130deg, #121b28, #10151e 55%, #172233); }
.orbit { position: absolute; right: -150px; bottom: -500px; width: 1000px; height: 680px;
  border: 1px solid #a6c6f415; border-radius: 50%; transform: rotate(-24deg);
  box-shadow: 0 -15px 60px #79a8f309, 0 -1px 0 #a6c6f40d; }
</style>
<main><div class="orbit"></div></main>
