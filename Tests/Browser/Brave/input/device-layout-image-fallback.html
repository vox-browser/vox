<!doctype html>
<meta charset="utf-8">
<style>
html,body{margin:0;background:white}
.row{position:absolute;left:20px;width:180px;font-size:0;background:#eef}
img{margin-right:10px}
.marker{display:inline-block;width:10px;height:70px;background:#168}
.after{height:3px;background:#c30}
#ltr{top:20px}
#rtl{top:120px;height:70px;direction:rtl}
#rtl img{position:absolute;right:10px;top:0;margin:0}
#rtl .marker{position:absolute;right:80px;top:0}
#rtl .after{position:absolute;top:70px;width:100%}

</style>
<div id="ltr" class="row"><img src="missing-broken-image.png" alt="" width="70" height="70"><span class="marker"></span><div class="after"></div></div>
<div id="rtl" class="row"><img src="missing-broken-image.png" alt="" width="70" height="70"><span class="marker"></span><div class="after"></div></div>
