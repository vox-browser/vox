<!doctype html><meta charset="utf-8"><title>Programmatic sticky scrollports</title>
<style>body{margin:0;background:white;font:13px/17px -apple-system,system-ui,sans-serif;color:hsl(210,8%,25%)}.scrollport{position:absolute;top:0;width:164px;height:200px;background:white;scrollbar-width:none}.sticky{position:sticky;top:0;height:200px}.row{position:absolute;left:34px}.spacer{height:1000px}</style>
<div class="scrollport" style="left:0px;overflow:hidden"><section class="sticky">
<div class="row" style="top:88px">Home</div>
<div class="row" style="top:153.5px">Unanswered</div>
<div class="row" style="top:186px">Tags</div>
</section><div class="spacer"></div></div>
<div class="scrollport" style="left:240px;overflow:auto"><section class="sticky">
<div class="row" style="top:88px">Home</div>
<div class="row" style="top:153.5px">Unanswered</div>
<div class="row" style="top:186px">Tags</div>
</section><div class="spacer"></div></div>
