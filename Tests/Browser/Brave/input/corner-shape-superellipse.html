<!doctype html><meta charset=utf-8>
<style>
body{margin:0;background:#fcfcfc}
.box{position:absolute;left:40px;width:700px;height:52px;box-sizing:border-box;background:white;border:1px solid #00000026;border-radius:28px;corner-shape:superellipse(1.1)}
.a{top:40px}
.b{top:140px;background-clip:padding-box}
.c{top:240px;background-clip:padding-box;box-shadow:0 0 0 1px #0000000a,0 2px 8px #0000000a,0 4px 80px 8px #00000006}
.d{top:340px;border-radius:28px 20px;corner-shape:superellipse(1.25);background-clip:content-box;padding:4px}
.e{top:440px;border-radius:28px / 20px;corner-shape:superellipse(.98)}
#neighbor{position:absolute;left:40px;top:96px;width:96px;height:40px;border-radius:20px;background:#0d0d0d}
</style>
<div class="box a"></div><div class="box b"></div><div class="box c"></div><div class="box d"></div><div class="box e"></div><aside id=neighbor></aside>
