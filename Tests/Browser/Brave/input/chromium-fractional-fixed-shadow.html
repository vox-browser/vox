<!doctype html>
<meta charset="utf-8">
<title>Fractional color in a fixed compositor shadow</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fcfcfc; }
#overflow { width: 1224px; height: 1006.453125px; }
.fixed { position: fixed; left: 260px; right: 0; top: 61px; bottom: 76px; }
.banner { position: absolute; left: 12px; bottom: 8px; width: 740px; height: 126.03125px;
  border: 1px solid rgb(0 0 0 / .05); border-radius: 30px;
  box-shadow: 0 4px 16px rgb(0 0 0 / .05); background: white; }
.button { position: absolute; top: 41px; right: 20px; width: 96px; height: 40px;
  border-radius: 999px; background: #0d0d0d; }
.reject { right: 124px; width: 166px; background: white; border: 1px solid #e5e5e5; }
</style>
<div id="overflow"></div>
<div class="fixed"><div class="banner"><div class="button reject"></div><div class="button"></div></div></div>
