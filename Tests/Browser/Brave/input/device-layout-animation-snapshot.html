<!doctype html><style>
html,body{margin:0;background:#fcfcfc}div{position:absolute;height:40px;background:#d34;animation:grow 1s linear -1s both paused}
.one{left:30px;top:30px}.two{left:30px;top:110px;width:70px!important;background:#4a7}
.three{left:30px;top:190px;background:#57b;animation:fade 1s linear -1s both paused;width:260px}
@keyframes grow{from{width:0px}to{width:calc(260px)}}@keyframes fade{from{opacity:1}to{opacity:.5}}
</style><div class="one"></div><div class="two"></div><div class="three"></div>
