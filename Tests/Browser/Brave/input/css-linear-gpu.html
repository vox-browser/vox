<!doctype html>
<!-- Native viewport: 1024x768. Original sRGB stops and GPU alpha blending. -->
<meta charset="utf-8"><base href="https://old.reddit.com/">
<style>
body{margin:0;background:white}
.box{position:absolute;top:20px;width:269px;height:151px}
.opaque{left:20px;background:linear-gradient(to bottom,#ef1834,#1358d0)}
.alpha{left:310px;background:#1264c8}
.hard{left:600px;background:#38a358}
.alpha:after,.hard:after{content:"";position:absolute;inset:0}
.alpha:after{background:linear-gradient(to bottom,transparent,rgba(0,0,0,.6))}
.hard:after{background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.6) 50%,#000 50%,#000)}
</style>
<div class="box opaque"></div><div class="box alpha"></div><div class="box hard"></div>
