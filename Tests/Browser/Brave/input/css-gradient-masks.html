<!doctype html>
<meta charset="utf-8">
<title>CSS gradient masks</title>
<style>
html,body{margin:0;background:#fcfdff}
.box{position:absolute;width:120px;height:80px;background:#f7b259}
#transparent{left:24px;top:24px;mask-image:linear-gradient(transparent,transparent)}
#opaque{left:168px;top:24px;mask-image:linear-gradient(white,white)}
#half{left:312px;top:24px;mask-image:linear-gradient(to right,white 50%,transparent 50%)}
#stripes{left:456px;top:24px;mask-image:repeating-linear-gradient(to right,white 0 10px,transparent 10px 20px)}
#ellipse{left:24px;top:136px;mask-image:radial-gradient(ellipse 48px 24px at 25% 75%,white,transparent)}
#circle{left:168px;top:136px;mask-image:radial-gradient(circle 40px,white,transparent)}
.round{position:absolute;top:248px;width:20px;height:20px;border-radius:100%;overflow:hidden}
.round div{width:100%;height:100%;border-radius:100%;background:#f7b259}
#standard{left:24px;mask-image:radial-gradient(circle,white 100%,black 100%)}
#legacy{left:64px;-webkit-mask-image:-webkit-radial-gradient(circle,white 100%,black 100%)}
</style>
<div id="transparent" class="box"></div>
<div id="opaque" class="box"></div>
<div id="half" class="box"></div>
<div id="stripes" class="box"></div>
<div id="ellipse" class="box"></div>
<div id="circle" class="box"></div>
<div id="standard" class="round"><div></div></div>
<div id="legacy" class="round"><div></div></div>
