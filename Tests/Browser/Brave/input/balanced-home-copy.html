<!doctype html>
<meta charset="utf-8">
<title>Balanced homepage copy</title>
<style>
html { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: white; color: #111; }
body { margin: 0; }
section { position: absolute; top: 20px; width: 220px; }
#optimized { left: 20px; }
#greedy { left: 280px; }
h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; }
p { margin: 8px 0 0; font-size: 12px; line-height: 16px; }
#optimized h2 { text-wrap: balance; }
#optimized p { text-wrap: pretty; }
#greedy h2, #greedy p { text-wrap: wrap; }
</style>
<section id="optimized"><h2>Get responses tailored to you</h2><p>Log in to get answers based on saved chats, plus create images and upload files.</p></section>
