<!doctype html>
<meta charset="utf-8"><title>Constant color through blurred shadow alpha</title>
<style>
html,body{margin:0;background:white}
.panel{position:absolute;top:40px;width:240px;height:640px}
.white{left:40px;background:white}.red{left:340px;background:red}.blue{left:640px;background:blue}
.shape{position:absolute;left:64px;top:100px;width:80px;height:80px;background:black}
.white .shape{filter:drop-shadow(20px 30px 16px #fff9)}
.red .shape{filter:drop-shadow(20px 30px 16px rgb(255 0 0 / .7))}
.blue .shape{filter:drop-shadow(20px 30px 16px rgb(0 0 255 / .4))}
svg{position:absolute;left:64px;top:400px;width:80px;height:80px;transform:rotate(-90deg)}
.white svg{filter:drop-shadow(20px 30px 16px #fff9)}
.red svg{filter:drop-shadow(20px 30px 16px rgb(255 0 0 / .7))}
.blue svg{filter:drop-shadow(20px 30px 16px rgb(0 0 255 / .4))}
</style>
<div class="panel white"><div class="shape"></div><svg viewBox="0 0 80 80"><path d="M0 0H80V80H0Z"/></svg></div>
<div class="panel red"><div class="shape"></div><svg viewBox="0 0 80 80"><path d="M0 0H80V80H0Z"/></svg></div>
<div class="panel blue"><div class="shape"></div><svg viewBox="0 0 80 80"><path d="M0 0H80V80H0Z"/></svg></div>
