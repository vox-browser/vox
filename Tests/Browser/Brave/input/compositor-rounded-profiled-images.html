<!doctype html><meta charset="utf-8"><title>Rounded color-managed images in a complete CSS picture</title><style>
body{margin:0;background:#090b0f}
.earlier{display:grid;height:200px}.earlier>div{background:#273c59}
.gap{height:6000px}.cards{display:grid;grid-template-columns:1fr 1fr;margin:0 48px;gap:20px}
.card{height:450px;padding-top:230.5px;box-sizing:border-box;display:flex;gap:48px;padding-left:24.25px;background:linear-gradient(135deg,#121b288f,#10151e8f)}
img{display:block;flex:none;border-radius:5px}
.natural{width:128px;height:80px}.large{width:193px;height:121px}
.before-scroll{height:2300px}.scroll{height:100px;margin:0 48px;overflow:auto;scrollbar-width:none}
.wide{width:2400px;height:80px}.after-scroll{height:1700px;margin:0 48px}
footer{height:100px;margin:0 48px;border-top:1px solid #273c59}
</style><div class="earlier"><div></div></div><div class="gap"></div>
<div class="cards"><div class="card">
<img class="natural" src="../resources/icc-sampling-p3.png"><img class="large" src="../resources/icc-sampling-p3.png">
</div><div class="card">
<img class="natural" src="../resources/icc-sampling-untagged.png"><img class="large" src="../resources/icc-sampling-untagged.png">
</div></div><div class="before-scroll"></div><div class="scroll"><div class="wide"></div></div>
<div class="after-scroll"></div><footer></footer>
