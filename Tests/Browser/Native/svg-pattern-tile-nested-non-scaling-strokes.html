<!doctype html>
<meta charset="utf-8">
<title>Device stroke width inside nested SVG patterns</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="320" height="90" viewBox="0 0 320 90">
  <defs>
    <pattern id="stripe" width="48" height="40" patternUnits="userSpaceOnUse"
             patternTransform="scale(1 .75)">
      <path d="M0 16H48" fill="none" stroke="lime" stroke-width="6"
            vector-effect="non-scaling-stroke"/>
    </pattern>
    <pattern id="tile" width="48" height="60" patternUnits="userSpaceOnUse"
             patternTransform="scale(.5)">
      <path d="M0 0h48v30H0Z" fill="url(#stripe)"/>
      <path d="M0 45H48" fill="none" stroke="url(#stripe)" stroke-width="30"/>
    </pattern>
  </defs>
  <path d="M0 0h96v90H0Z" fill="url(#tile)"/>
  <path d="M0 0h96v90H0Z" fill="url(#tile)" transform="translate(112)"/>
  <path d="M0 0h96v45H0Z" fill="url(#tile)" transform="translate(224) scale(1 2)"/>
</svg>
