<!doctype html>
<meta charset="utf-8">
<title>WebGL Metal smoke pending</title>
<style>
html, body { margin: 0; background: white; }
canvas { position: absolute; top: 0; width: 64px; height: 64px; }
#webgl1 { left: 0; } #webgl2 { left: 64px; }
</style>
<canvas id="webgl1" width="64" height="64"></canvas>
<canvas id="webgl2" width="64" height="64"></canvas>
<script>
(function () {
    function check(condition, message) { if (!condition) throw new Error(message); }
    function exercise(version) {
        var canvas = document.getElementById('webgl' + version);
        var gl = canvas.getContext(version === 1 ? 'webgl' : 'webgl2', {preserveDrawingBuffer: true});
        check(gl, 'context ' + version);
        var modern = version === 2;
        function shader(type, source) {
            var result = gl.createShader(type);
            gl.shaderSource(result, source);
            gl.compileShader(result);
            check(gl.getShaderParameter(result, gl.COMPILE_STATUS), gl.getShaderInfoLog(result));
            check(gl.getShaderSource(result) === source, 'source preservation');
            return result;
        }
        var vertex = shader(gl.VERTEX_SHADER, modern ?
            '#version 300 es\nin vec2 position; void main(){gl_Position=vec4(position,0.0,1.0);}' :
            'attribute vec2 position; void main(){gl_Position=vec4(position,0.0,1.0);}');
        var fragment = shader(gl.FRAGMENT_SHADER, modern ?
            '#version 300 es\nprecision mediump float; uniform vec4 color; out vec4 pixel; void main(){pixel=color;}' :
            'precision mediump float; uniform vec4 color; void main(){gl_FragColor=color;}');
        var program = gl.createProgram();
        gl.attachShader(program, vertex); gl.attachShader(program, fragment); gl.linkProgram(program);
        check(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program));
        gl.useProgram(program);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
        var location = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(location); gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
        var color = gl.getUniformLocation(program, 'color');
        gl.viewport(0, 0, 64, 64);
        gl.uniform4f(color, modern ? 0 : 1, modern ? 1 : 0, 0, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.enable(gl.SCISSOR_TEST); gl.scissor(0, 0, 64, 32);
        gl.uniform4f(color, modern ? 1 : 0, modern ? 1 : 0, modern ? 0 : 1, 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        var pixels = new Uint8Array(64 * 64 * 4);
        gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        for (var y = 0; y < 64; ++y) {
            for (var x = 0; x < 64; ++x) {
                var index = (y * 64 + x) * 4;
                var expected = y < 32 ? (modern ? [255,255,0,255] : [0,0,255,255]) :
                    (modern ? [0,255,0,255] : [255,0,0,255]);
                for (var channel = 0; channel < 4; ++channel)
                    check(pixels[index + channel] === expected[channel], 'pixel ' + version + '/' + x + '/' + y + '/' + channel);
            }
        }
        check(gl.getError() === gl.NO_ERROR, 'GL error ' + version);
        return gl.getParameter(gl.RENDERER);
    }
    try {
        var renderers = [exercise(1), exercise(2)];
        document.title = 'WebGL Metal smoke PASS';
        console.log('WEBGL_METAL_SMOKE_PASS ' + JSON.stringify(renderers));
    } catch (error) {
        document.title = 'WebGL Metal smoke FAIL';
        document.body.style.background = 'magenta';
        console.error('WEBGL_METAL_SMOKE_FAIL ' + error.message);
        throw error;
    }
}());
</script>
