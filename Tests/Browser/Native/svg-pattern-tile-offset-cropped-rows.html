<!doctype html>
<meta charset="utf-8">
<title>SVG pattern offset clips tall isolated layers</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="400" height="100" viewBox="0 0 400 100">
  <defs>
    <filter id="region" filterUnits="userSpaceOnUse" x="-8" y="-8" width="56" height="96">
      <feOffset id="offset" dx="2" dy="4" x="6" y="8" width="22" height="6"/>
    </filter>
    <pattern id="tile" width="40" height="80" patternUnits="userSpaceOnUse">
      <g filter="url(#region)">
        <g opacity=".6"><path d="M6 4H24V68H6Z" fill="red"/></g>
      </g>
      <path d="M0 70H40V74H0Z" fill="lime"/>
    </pattern>
    <mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0H120V100H0Z" fill="url(#tile)"/>
    </mask>
  </defs>
  <path d="M0 0H120V100H0Z" fill="url(#tile)"/>
  <path d="M0 50H120" fill="none" stroke="url(#tile)" stroke-width="100"
        transform="translate(128)"/>
  <g transform="translate(256)">
    <path d="M0 0H120V100H0Z" fill="black" mask="url(#alpha)"/>
  </g>
</svg>
<script>
let frame = 0;
function editSubregion() {
    if (++frame === 12) {
        const offset = document.getElementById('offset');
        offset.setAttribute('dx', '-2');
        offset.setAttribute('y', '10');
        offset.setAttribute('height', '9');
    }
    if (frame === 24)
        document.body.setAttribute('data-offset-ready', '');
    else
        requestAnimationFrame(editSubregion);
}
requestAnimationFrame(editSubregion);
</script>
