<!doctype html>
<meta charset="utf-8">
<title>GG SVG concentric radial spread</title>
<style>
  body { margin: 0; min-height: 4096px; background: white; }
  .stage { position: fixed; top: 0; left: 0; }
  header { width: 16px; height: 8px; background: #34b786; }
  svg { display: block; }
</style>
<div class="stage">
  <header></header>
  <svg width="520" height="116">
    <defs>
      <radialGradient id="repeat-outer" gradientUnits="userSpaceOnUse" cx="112.5" cy="48.5"
                      fr="10" r="28" spreadMethod="repeat">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="reflect-outer" gradientUnits="userSpaceOnUse" cx="384.5" cy="48.5"
                      fr="18" r="42" spreadMethod="reflect">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
    </defs>
    <path d="M8 8H232V104H8Z" fill="url(#repeat-outer)"/>
    <path d="M256 8H512V96H256Z" fill="url(#reflect-outer)" fill-opacity=".5"/>
  </svg>
</div>
