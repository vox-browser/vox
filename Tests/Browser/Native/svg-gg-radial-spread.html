<!doctype html>
<meta charset="utf-8">
<title>GG SVG radial spread</title>
<style>
  body { margin: 0; min-height: 4096px; background: white; }
  .stage { position: fixed; top: 0; left: 0; }
  header { width: 16px; height: 8px; background: #34b786; }
  svg { display: block; }
</style>
<div class="stage">
  <header></header>
  <svg width="520" height="320">
    <defs>
      <radialGradient id="repeat-outer" gradientUnits="userSpaceOnUse" cx="112.5" cy="48.5"
                      fr="10" r="28" spreadMethod="repeat">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="offset-pad" gradientUnits="userSpaceOnUse" cx="120.5" cy="164.5"
                      fx="108.5" fy="164.5" fr="8" r="32">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="offset-point" gradientUnits="userSpaceOnUse" cx="384.5" cy="180.5"
                      fx="372.5" fy="164.5" r="40" spreadMethod="reflect">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="reflect-outer" gradientUnits="userSpaceOnUse" cx="384.5" cy="48.5"
                      fr="18" r="42" spreadMethod="reflect">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="tangent-circle" gradientUnits="userSpaceOnUse" cx="100.5" cy="272.5"
                      fx="78.5" fy="272.5" fr="8" r="32">
        <stop offset="0" stop-color="red"/>
        <stop offset="1" stop-color="blue"/>
      </radialGradient>
      <radialGradient id="tangent-point" gradientUnits="userSpaceOnUse" cx="352.5" cy="288.5"
                      fx="340.5" fy="272.5" r="20">
        <stop offset="0" stop-color="#ff0000"/>
        <stop offset=".25" stop-color="#bf0040"/>
        <stop offset=".5" stop-color="#800080"/>
        <stop offset=".75" stop-color="#4000bf"/>
        <stop offset="1" stop-color="#0000ff"/>
      </radialGradient>
    </defs>
    <path d="M8 8H232V104H8Z" fill="url(#repeat-outer)"/>
    <path d="M256 8H512V96H256Z" fill="url(#reflect-outer)" fill-opacity=".5"/>
    <path d="M8 124H216V220H8Z" fill="url(#offset-pad)"/>
    <path d="M256 124H496V212H256Z" fill="url(#offset-point)" fill-opacity=".5"/>
    <path d="M8 240H192V312H8Z" fill="url(#tangent-circle)"/>
    <path d="M264 240H456V312H264Z" fill="url(#tangent-point)" fill-opacity=".5"/>
  </svg>
</div>
