<!doctype html>
<meta charset="utf-8">
<title>Bitmap and stroke in a standalone SVG tile</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="256" height="100" viewBox="0 0 256 100">
  <defs>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"
             patternTransform="scale(.5)">
      <path d="M0 20H40" fill="none" stroke="lime" stroke-width="12"/>
      <image href="tile.png" x="0" y="28" width="16" height="12"
             preserveAspectRatio="none" image-rendering="pixelated"/>
    </pattern>
  </defs>
  <rect width="120" height="100" fill="url(#tile)"/>
  <rect width="120" height="100" fill="url(#tile)" transform="translate(128)"/>
</svg>
