<!doctype html>
<meta charset="utf-8">
<title>SVG pattern tile with saturation and hue rotation</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="384" height="100" viewBox="0 0 384 100">
  <defs>
    <filter id="shade" color-interpolation-filters="sRGB">
      <feColorMatrix id="saturation" type="saturate" values=".5"/>
      <feColorMatrix id="rotation" type="hueRotate" values="90"/>
    </filter>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"
             patternTransform="scale(.5)">
      <g filter="url(#shade)">
        <path d="M4 4h20v8H4Z" fill="red"/>
        <path d="M4 28h28v4H4Z" fill="none"/>
      </g>
      <path d="M0 36h40v4H0Z" fill="lime"/>
    </pattern>
    <mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
    </mask>
  </defs>
  <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
  <path d="M0 50H120" fill="none" stroke="url(#tile)" stroke-width="100"
        transform="translate(128)"/>
  <g transform="translate(256)">
    <path d="M0 0h120v100H0Z" fill="black" mask="url(#alpha)"/>
  </g>
</svg>
<script>
let frame = 0;
function editFilter() {
    if (++frame === 12) {
        document.getElementById('shade').setAttribute('color-interpolation-filters', 'linearRGB');
        document.getElementById('saturation').setAttribute('values', '2');
        document.getElementById('rotation').setAttribute('values', '-90');
    }
    if (frame === 24)
        document.body.setAttribute('data-color-matrix-ready', '');
    else
        requestAnimationFrame(editFilter);
}
requestAnimationFrame(editFilter);
</script>
