<!doctype html>
<meta charset="utf-8">
<title>SVG gradient mask opacity groups</title>
<style>
body { margin: 0; background: white; }
svg { display: block; }
</style>
<svg width="640" height="1840" viewBox="0 0 640 1840">
  <defs>
    <linearGradient id="alpha" gradientUnits="userSpaceOnUse" x1="13" x2="125" y1="15" y2="65">
      <stop stop-opacity="0"/>
      <stop offset="1"/>
    </linearGradient>
    <linearGradient id="luminance" gradientUnits="userSpaceOnUse" x1="265" x2="265" y1="15" y2="100">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="lime"/>
    </linearGradient>
    <mask id="alpha-mask" mask-type="alpha" maskUnits="userSpaceOnUse" x="15" y="5" width="200" height="118">
      <g opacity=".5">
        <path d="M21 11h180v100H21Z" fill="url(#alpha)"/>
        <path d="M147 26h62v75h-62Z"/>
      </g>
    </mask>
    <mask id="luminance-mask" mask-type="luminance" maskUnits="userSpaceOnUse" x="265" y="12" width="180" height="100">
      <g opacity=".625">
        <path d="M255 15h200v90H255Z" fill="url(#luminance)"/>
        <path d="M393 44h54v46h-54Z" fill="red"/>
      </g>
    </mask>
  </defs>
  <g id="sample">
    <path d="M0 0h220v125H0Z" mask="url(#alpha-mask)" fill="blue"/>
    <path d="M240 0h230v125H240Z" mask="url(#luminance-mask)" fill="red"/>
    <path d="M490 27h40v40h-40Z" fill="#f80"/>
  </g>
  <use href="#sample" y="180"/><use href="#sample" y="360"/><use href="#sample" y="540"/>
  <use href="#sample" y="720"/><use href="#sample" y="900"/><use href="#sample" y="1080"/>
  <use href="#sample" y="1260"/><use href="#sample" y="1440"/><use href="#sample" y="1620"/>
</svg>
