<!doctype html>
<meta charset="utf-8">
<title>SVG gradient groups</title>
<style>
  body { margin: 0; background: white; }
  header { width: 8px; height: 8px; background: #34b786; }
  svg { display: block; }
</style>
<header></header>
<svg width="360" height="264" viewBox="0 0 360 264">

  <path fill="url(#blue)" mask="url(#alpha)" d="M12 196h144v56H12Z"/>
