<!doctype html>
<meta charset="utf-8">
<title>SVG pattern offset with fractional clip edges</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="400" height="100" viewBox="0 0 400 100">
  <defs>
    <filter id="region" filterUnits="userSpaceOnUse" x="-12" y="-12" width="80" height="80">
      <feOffset id="offset" dx="-4" x="2.75" y="5.75" width="9.5" height="5.5"/>
    </filter>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M2 4H26V16H2Z" fill="red" filter="url(#region)"/>
      <path d="M0 36h40v4H0Z" fill="lime"/>
    </pattern>
    <mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
    </mask>
  </defs>
  <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
  <path d="M0 50H120" fill="none" stroke="url(#tile)" stroke-width="100"
        transform="translate(128)"/>
  <g transform="translate(256)">
    <path d="M0 0h120v100H0Z" fill="black" mask="url(#alpha)"/>
  </g>
</svg>
<script>
let frame = 0;
function editClipEdges() {
    if (++frame === 12) {
        const offset = document.getElementById('offset');
        offset.setAttribute('x', '7.25');
        offset.setAttribute('y', '6.25');
        offset.setAttribute('width', '6.5');
    }
    if (frame === 24)
        document.body.setAttribute('data-offset-ready', '');
    else
        requestAnimationFrame(editClipEdges);
}
requestAnimationFrame(editClipEdges);
</script>
