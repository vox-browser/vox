<!doctype html>
<meta charset="utf-8">
<title>SVG pattern offset with an object bounding box filter region</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="384" height="100" viewBox="0 0 384 100">
  <defs>
    <filter id="region">
      <feOffset id="offset" dx="8" dy="4"/>
    </filter>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse"
             patternTransform="scale(.5)">
      <path id="source" d="M10 10h20v20H10Z" fill="red" filter="url(#region)"/>
      <path d="M0 36h40v4H0Z" fill="lime"/>
    </pattern>
    <mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
    </mask>
  </defs>
  <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
  <path d="M0 50H120" fill="none" stroke="url(#tile)" stroke-width="100"
        transform="translate(128)"/>
  <g transform="translate(256)">
    <path d="M0 0h120v100H0Z" fill="black" mask="url(#alpha)"/>
  </g>
</svg>
<script>
let frame = 0;
function editFilter() {
    if (++frame === 12) {
        document.getElementById('source').setAttribute('d', 'M16 8h20v20H16Z');
        const offset = document.getElementById('offset');
        offset.setAttribute('dx', '-4');
        offset.setAttribute('dy', '-4');
        const filter = document.getElementById('region');
        filter.setAttribute('x', '50%');
        filter.setAttribute('y', '0');
        filter.setAttribute('width', '50%');
        filter.setAttribute('height', '1.5');
    }
    if (frame === 24)
        document.body.setAttribute('data-offset-ready', '');
    else
        requestAnimationFrame(editFilter);
}
requestAnimationFrame(editFilter);
</script>
