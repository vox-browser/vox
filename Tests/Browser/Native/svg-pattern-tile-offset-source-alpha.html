<!doctype html>
<meta charset="utf-8">
<title>SVG pattern tile with a SourceAlpha offset</title>
<style>
body { margin: 0; background: white; }
header { width: 8px; height: 8px; background: #34b786; }
svg { display: block; }
</style>
<header></header>
<svg width="512" height="100" viewBox="0 0 512 100">
  <defs>
    <filter id="region" filterUnits="userSpaceOnUse" x="-12" y="-12" width="80" height="80">
      <feOffset id="offset" in="SourceAlpha" dx="8" dy="4" x="13" y="10" width="13" height="8"/>
    </filter>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M8 6H24V22H8Z" fill="#ff000080" filter="url(#region)"/>
      <path d="M0 36h40v4H0Z" fill="white"/>
    </pattern>
    <mask id="alpha" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
    </mask>
    <mask id="luminance" mask-type="luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="100">
      <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
    </mask>
  </defs>
  <path d="M0 0h120v100H0Z" fill="url(#tile)"/>
  <path d="M0 50H120" fill="none" stroke="url(#tile)" stroke-width="100"
        transform="translate(128)"/>
  <g transform="translate(256)">
    <path d="M0 0h120v100H0Z" fill="black" mask="url(#alpha)"/>
  </g>
  <g transform="translate(384)">
    <path d="M0 0h120v100H0Z" fill="black" mask="url(#luminance)"/>
  </g>
</svg>
<script>
let frame = 0;
function editOffset() {
    if (++frame === 12)
        document.getElementById('offset').setAttribute('dx', '-2');
    if (frame === 24)
        document.body.setAttribute('data-offset-ready', '');
    else
        requestAnimationFrame(editOffset);
}
requestAnimationFrame(editOffset);
</script>
