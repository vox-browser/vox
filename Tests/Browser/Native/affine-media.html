<!doctype html>
<meta charset="utf-8">
<title>Affine media</title>
<style>
body { margin: 0; background: #101820 }
#marker { width: 8px; height: 8px; background: #ea70b5 }
canvas, video, img { position: absolute; top: 16px; transform-origin: top left; image-rendering: pixelated }
#rotated { left: 84px; transform: matrix(0, 1, -1, 0, 0, 0) }
#reflected { left: 156px; transform: scaleX(-1) }
#sheared { left: 200px; transform: matrix(1, 0, 1, 1, 0, 0) }
video { left: 328px; width: 24px; height: 24px; object-fit: cover; transform: matrix(0, 1, -1, 0, 0, 0) }
img { top: 116px }
#image-rotated { left: 96px; transform: matrix(0, 1, -1, 0, 0, 0) }
#image-reflected { left: 184px; transform: scaleX(-1) }
#image-sheared { left: 220px; transform: matrix(1, 0, 1, 1, 0, 0) }
#image-cropped { left: 388px; width: 24px; height: 24px; object-fit: cover; transform: matrix(0, 1, -1, 0, 0, 0) }
.sampling { top: 180px; width: 64px; height: 24px }
#sample-nearest { left: 16px }
#sample-linear { left: 96px; image-rendering: auto }
#sample-rounded { left: 176px; border-radius: 8px }
#sample-sheared { left: 256px; transform: matrix(1, 0, 1, 1, 0, 0) }
#sample-minified { left: 364px; width: 16px; height: 8px; image-rendering: crisp-edges }
</style>
<div id="marker"></div>
<canvas id="rotated" width="40" height="24"></canvas>
<canvas id="reflected" width="40" height="24"></canvas>
<canvas id="sheared" width="40" height="24"></canvas>
<video preload="none" poster="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAYCAYAAAC8/X7cAAAAQklEQVR4nO3PMQEAEBAAQFGMIvwojhgiiWDUigxvvuECXDkRN6POntLGSjk7UoqAgICAgICAgICAgICAgICAwE/gAQpGNxeUm9laAAAAAElFTkSuQmCC"></video>
<img id="image-rotated" width="40" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAYCAYAAACIhL/AAAAAM0lEQVR42u3OsREAMAwCMfZf2vEQpPEJ7ntlkmn24YCAgICAgKeBZd8u1QABAQEBAY8DH1u9aAlzw0lGAAAAAElFTkSuQmCC">
<img id="image-reflected" width="40" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAYCAYAAACIhL/AAAAAM0lEQVR42u3OsREAMAwCMfZf2vEQpPEJ7ntlkmn24YCAgICAgKeBZd8u1QABAQEBAY8DH1u9aAlzw0lGAAAAAElFTkSuQmCC">
<img id="image-sheared" width="40" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACgAAAAYCAYAAACIhL/AAAAAM0lEQVR42u3OsREAMAwCMfZf2vEQpPEJ7ntlkmn24YCAgICAgKeBZd8u1QABAQEBAY8DH1u9aAlzw0lGAAAAAElFTkSuQmCC">
<img id="image-cropped" width="24" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAYCAYAAAC8/X7cAAAAQklEQVR4nO3PMQEAEBAAQFGMIvwojhgiiWDUigxvvuECXDkRN6POntLGSjk7UoqAgICAgICAgICAgICAgICAwE/gAQpGNxeUm9laAAAAAElFTkSuQmCC">
<img id="sample-nearest" class="sampling" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR42mP4z8DwHwQBEPgD/VP9jxkAAAAASUVORK5CYII=">
<img id="sample-linear" class="sampling" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR42mP4z8DwHwQBEPgD/VP9jxkAAAAASUVORK5CYII=">
<img id="sample-rounded" class="sampling" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR42mP4z8DwHwQBEPgD/VP9jxkAAAAASUVORK5CYII=">
<img id="sample-sheared" class="sampling" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAYAAAD0In+KAAAADklEQVR42mP4z8DwHwQBEPgD/VP9jxkAAAAASUVORK5CYII=">
<img id="sample-minified" class="sampling" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAQCAYAAACm53kpAAAALklEQVR42u3QsQ0AAAzCMP5/mqp3YGXI7jTpt/oAAAAAAAAAAAAAAAAAAAAAez+SH/hqB+OYUwAAAABJRU5ErkJggg==">
<script>
for (const id of ['rotated', 'reflected', 'sheared']) {
    const context = document.getElementById(id).getContext('2d');
    for (const [x, y, color] of [[0, 0, '#ff0000'], [20, 0, '#00ff00'], [0, 12, '#0000ff'], [20, 12, '#ffff00']]) {
        context.fillStyle = color;
        context.fillRect(x, y, 20, 12);
    }
}
</script>
