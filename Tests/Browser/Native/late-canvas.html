<!doctype html>
<meta charset="utf-8">
<title>Late canvas paint</title>
<style>
body { margin: 0; background: #101820 }
#marker { width: 8px; height: 8px; background: #ea70b5 }
canvas { position: absolute; top: 16px; left: 16px }
#gl { left: 96px }
</style>
<div id="marker"></div>
<canvas id="two" width="64" height="40"></canvas>
<canvas id="gl" width="48" height="32"></canvas>
<script>
requestAnimationFrame(() => setTimeout(() => {
    const two = document.getElementById('two').getContext('2d');
    two.fillStyle = '#00ff00';
    two.fillRect(0, 0, 64, 40);
    const gl = document.getElementById('gl').getContext('webgl2');
    gl.clearColor(1, 1, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL draw failed');
}, 650));
</script>
